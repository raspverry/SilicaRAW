[package]
name = "silica-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SilicaRAW desktop shell and packaging spike"
default-run = "silica-desktop"
publish = false

[[bin]]
name = "silica-desktop"
path = "src/main.rs"

[features]
default = []
native-metal-viewer = []
metal-host-spike = [
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-core-graphics",
  "dep:objc2-foundation",
  "dep:objc2-metal",
  "dep:objc2-metal-kit",
  "dep:objc2-quartz-core",
]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
silica-core = { path = "../../../crates/silica-core" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = { version = "2.7.1", default-features = false }

[dev-dependencies]
image = { version = "=0.25.6", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"], optional = true }
objc2-core-graphics = { version = "0.3.2", default-features = false, optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSObject", "objc2-core-foundation", "std"], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLResource", "MTLTexture", "std"], optional = true }
objc2-metal-kit = { version = "0.3.2", default-features = false, features = ["MTKView", "objc2-app-kit", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"], optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-metal"], optional = true }
