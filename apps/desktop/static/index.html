<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SilicaRAW</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101214;
        color: #f4f1ec;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
        padding: 48px clamp(32px, 8vw, 128px);
      }

      main {
        width: min(420px, 42vw);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #bbb5ad;
        font-size: 14px;
        line-height: 1.5;
      }

      @media (max-width: 760px) {
        body {
          padding: 32px;
        }

        main {
          width: min(420px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SilicaRAW</h1>
      <p>Local desktop shell for Phase 2 packaging validation.</p>
    </main>
  </body>
</html>
