<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SilicaRAW</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
  </head>
  <body>
    <main>
      <h1>SilicaRAW</h1>
      <p>Local library alpha.</p>
      <form>
        <label for="libraryPath">Library folder path</label>
        <input id="libraryPath" name="libraryPath" autocomplete="off" spellcheck="false">
        <div class="actions">
          <button class="primary" id="createLibrary" type="button">Create Library</button>
          <button id="openLibrary" type="button">Open Library</button>
        </div>
      </form>
      <output id="status" aria-live="polite"></output>
    </main>
    <script>
      const pathInput = document.querySelector("#libraryPath");
      const statusOutput = document.querySelector("#status");
      const createButton = document.querySelector("#createLibrary");
      const openButton = document.querySelector("#openLibrary");

      const invoke = window.__TAURI__?.core?.invoke;

      function setBusy(isBusy) {
        createButton.disabled = isBusy;
        openButton.disabled = isBusy;
      }

      async function runLibraryCommand(command) {
        const path = pathInput.value.trim();
        if (!path) {
          statusOutput.value = "Enter a library folder path.";
          return;
        }

        if (!invoke) {
          statusOutput.value = "Desktop runtime unavailable.";
          return;
        }

        setBusy(true);
        statusOutput.value = "Working...";
        try {
          statusOutput.value = await invoke(command, { path });
        } catch (error) {
          statusOutput.value = String(error);
        } finally {
          setBusy(false);
        }
      }

      createButton.addEventListener("click", () => runLibraryCommand("create_library"));
      openButton.addEventListener("click", () => runLibraryCommand("open_library"));
    </script>
  </body>
</html>
