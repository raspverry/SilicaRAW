<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SilicaRAW</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101214;
        color: #f4f1ec;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #bbb5ad;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SilicaRAW</h1>
      <p>Local desktop shell for Phase 2 packaging validation.</p>
    </main>
  </body>
</html>
